name: Build SnapTools

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Pinned, not ubuntu-latest: the `latest` label migrates to Ubuntu 26 from
    # 19 October 2026, which would silently change the JDK/SDK image under the
    # build. Bump this deliberately after testing.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Capacitor 8 compiles with JavaVersion.VERSION_21 — both
      # @capacitor/android and @capacitor-community/admob declare
      # sourceCompatibility/targetCompatibility 21. JDK 17 fails with
      # "invalid source release: 21". Capacitor 5 needed 17; 8 needs 21.
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Capacitor 8's CLI declares engines.node >= 22.0.0.
      # Node 20 here will hard-fail `npx cap`.
      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Catches regressions in the QR encoder, unit maths, ledger and image
      # pipeline before a broken build ever reaches a device.
      # Fails in seconds instead of ~10 minutes into Gradle. Reads the Java
      # level Capacitor actually compiles with and compares it to the runner
      # JDK, so a future Capacitor bump that needs a newer JDK is obvious.
      - name: Verify JDK matches Capacitor
        run: |
          REQ=$(grep -hoP 'sourceCompatibility JavaVersion\.VERSION_\K[0-9]+' \
                node_modules/@capacitor/android/capacitor/build.gradle \
                node_modules/@capacitor-community/admob/android/build.gradle \
                2>/dev/null | sort -rn | head -1)
          CUR=$(java -version 2>&1 | head -1 | grep -oP '"\K[0-9]+')
          echo "Capacitor requires Java $REQ · runner has Java $CUR"
          if [ -n "$REQ" ] && [ "$CUR" -lt "$REQ" ]; then
            echo "::error::Runner JDK $CUR is older than the Java $REQ Capacitor compiles with. Bump java-version in setup-java."
            exit 1
          fi

      - name: Run algorithm tests
        run: node tools/test-algorithms.js

      # Non-blocking: warns if listing copy exceeds Play's limits or still
      # contains placeholders, without failing the build.
      - name: Check store listing
        continue-on-error: true
        run: node tools/check-listing.js

      # www/ is Capacitor's webDir — EVERYTHING in it is bundled into the APK.
      # Notes and editor backups have shipped inside this app before
      # (www/index.html.bak still held live ad IDs and revenue claims), so
      # strip them here. This makes it safe even if one gets re-added later.
      - name: Strip non-app files from webDir
        run: |
          echo "Before:"; ls -1 www/
          rm -f www/*.md www/*.bak www/*.bak.* www/*~ www/*.orig
          echo "Shipping:"; ls -1 www/
          if ls www/*.md www/*.bak >/dev/null 2>&1; then
            echo "::error::non-app files still present in webDir"; exit 1
          fi

      - name: Generate Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      # Inject the AdMob App ID rather than overwriting the whole manifest.
      # Rewriting AndroidManifest.xml wholesale breaks every time the
      # Capacitor template changes; a targeted insert survives upgrades.
      # Capacitor regenerates android/ every build, restoring its placeholder
      # icon, so brand icons must be re-applied after `cap add`.
      - name: Apply launcher icons
        run: |
          pip install --quiet pillow
          python3 tools/make-launcher-icons.py

      - name: Inject AdMob App ID into manifest
        run: |
          python3 - <<'PY'
          import re, sys, pathlib

          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          xml = p.read_text()
          APP_ID = "ca-app-pub-4629035871778268~6034680409"

          if "com.google.android.gms.ads.APPLICATION_ID" in xml:
              print("AdMob App ID already present; leaving as-is.")
              sys.exit(0)

          meta = (
              '        <meta-data\n'
              '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
              f'            android:value="{APP_ID}"/>\n'
          )
          new_xml, n = re.subn(r'(\s*</application>)', '\n' + meta + r'\1', xml, count=1)
          if n != 1:
              sys.exit("FAILED: could not find </application> in manifest")

          p.write_text(new_xml)
          print("Injected AdMob App ID.")
          PY
          echo "--- manifest ---"
          cat android/app/src/main/AndroidManifest.xml

      # Capacitor's template hardcodes `versionCode 1`. Play rejects any
      # upload whose versionCode already exists, so it must be unique and
      # increasing on every release. A gradle -P flag cannot override a
      # hardcoded literal, so patch the file directly.
      - name: Set version code
        run: |
          BUILD_GRADLE=android/app/build.gradle
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode 1$/versionCode ${VERSION_CODE}/" "$BUILD_GRADLE"
          sed -i "s/versionName \"1.0\"$/versionName \"1.0.${VERSION_CODE}\"/" "$BUILD_GRADLE"
          grep -nE 'versionCode|versionName' "$BUILD_GRADLE"
          if ! grep -q "versionCode ${VERSION_CODE}" "$BUILD_GRADLE"; then
            echo "::error::versionCode patch failed — would upload as duplicate version."
            exit 1
          fi

      - name: Verify target API level
        run: |
          # Google Play requires targetSdk 36+ for all new apps and updates
          # submitted from 31 Aug 2026. Fail loudly here rather than at upload.
          echo "--- variables.gradle ---"
          cat android/variables.gradle
          TARGET=$(grep -oP 'targetSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle | head -1)
          echo "Detected targetSdkVersion: ${TARGET:-unknown}"
          if [ -n "$TARGET" ] && [ "$TARGET" -lt 36 ]; then
            echo "::error::targetSdk $TARGET is below 36 — Google Play will reject this build."
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SnapTools-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          archive: false

      # ----- Signed release bundle for Google Play -----
      # Skipped automatically until the four signing secrets exist, so the
      # workflow keeps working before you set them up.
      - name: Check for signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set — skipping release AAB."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.ready == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release AAB
        if: steps.signing.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          # versionCode was already patched into build.gradle above.
          ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release AAB
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SnapTools-release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          archive: false

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
